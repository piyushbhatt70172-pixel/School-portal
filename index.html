<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#14213d">
<title>School Portal</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
font-family:Arial,sans-serif;
background:#f4f7fb;
color:#172033
}
header{
background:#14213d;
color:white;
padding:16px 18px;
position:sticky;
top:0;
z-index:10
}
.header{
max-width:1100px;
margin:auto;
display:flex;
justify-content:space-between;
align-items:center
}
.logo{font-size:22px;font-weight:bold}
.logo span{color:#4da3ff}
.menu{
background:#24385f;
border:0;
color:white;
padding:10px 14px;
border-radius:10px
}
.container{
max-width:1100px;
margin:auto;
padding:22px 18px 70px
}
.hero{
background:linear-gradient(135deg,#14213d,#2455a4);
color:white;
border-radius:20px;
padding:27px;
margin-bottom:20px
}
.hero h1{font-size:28px;margin-bottom:8px}
.hero p{opacity:.9}

.tabs{
display:flex;
gap:8px;
overflow-x:auto;
margin-bottom:20px
}
.tab{
border:0;
background:white;
padding:12px 18px;
border-radius:12px;
font-weight:bold;
white-space:nowrap
}
.tab.active{
background:#2455a4;
color:white
}

.page{display:none}
.page.active{display:block}

.title{
font-size:20px;
margin:20px 0 12px
}

.cards{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:14px
}
.card,.panel,.feature,.notice,.application,.profile{
background:white;
border-radius:16px;
box-shadow:0 4px 15px rgba(0,0,0,.06)
}
.card{padding:19px}
.card .icon{font-size:25px;margin-bottom:8px}
.card h3{
font-size:14px;
color:#667085;
margin-bottom:6px
}
.card strong{font-size:25px}

.features{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:14px
}
.feature{
padding:20px;
border:1px solid #e7ebf2
}
.feature h3{margin:10px 0 6px}
.feature p{
color:#667085;
font-size:14px
}

.panel{
padding:20px;
margin-bottom:16px
}
.panel h2,.panel h3{margin-bottom:12px}

input,textarea{
width:100%;
padding:11px;
border:1px solid #d8dee9;
border-radius:10px;
font:inherit;
margin-top:6px
}
textarea{
min-height:90px;
resize:vertical
}
.form-grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:14px
}
.form-group{margin-bottom:12px}

button{
cursor:pointer
}
.primary,.secondary,.danger{
border:0;
border-radius:10px;
padding:11px 15px;
font-weight:bold
}
.primary{
background:#2455a4;
color:white
}
.secondary{
background:#e8eef8;
color:#17345f
}
.danger{
background:#fee2e2;
color:#991b1b
}
.actions{
display:flex;
gap:8px;
flex-wrap:wrap;
margin-top:10px
}

.login{
max-width:450px;
margin:25px auto
}
.login-icon{
font-size:40px;
margin-bottom:10px
}

.hidden{display:none!important}
.muted{
color:#667085;
font-size:14px
}
.error{
color:#b42318;
font-weight:bold
}
.success{
color:#067647;
font-weight:bold
}

.notice{
padding:16px;
margin-bottom:10px;
border-left:4px solid #2455a4
}
.notice p{margin:7px 0}

.application{
padding:16px;
margin-bottom:10px;
display:flex;
justify-content:space-between;
align-items:center
}
.status{
padding:6px 10px;
border-radius:20px;
font-size:12px;
font-weight:bold
}
.pending{
background:#fff3cd;
color:#856404
}
.approved{
background:#d1fae5;
color:#065f46
}

.profile{
padding:22px;
display:grid;
grid-template-columns:130px 1fr;
gap:20px
}
.avatar{
width:110px;
height:110px;
border-radius:50%;
background:#2455a4;
color:white;
display:flex;
align-items:center;
justify-content:center;
font-size:40px;
font-weight:bold
}
.profile p{margin:9px 0}

table{
width:100%;
border-collapse:collapse;
background:white
}
th,td{
padding:12px;
text-align:left;
border-bottom:1px solid #edf0f5
}
th{background:#f0f4fa}

.empty{
padding:25px;
text-align:center;
color:#667085;
background:white;
border-radius:15px
}

footer{
text-align:center;
color:#667085;
padding:25px;
font-size:13px
}

@media(max-width:800px){
.cards{grid-template-columns:repeat(2,1fr)}
.features{grid-template-columns:1fr 1fr}
}

@media(max-width:550px){
.cards,.features,.form-grid{grid-template-columns:1fr}
.profile{grid-template-columns:1fr}
.application{
flex-direction:column;
align-items:flex-start;
gap:10px
}
th,td{font-size:13px;padding:9px}
}
</style>
</head>

<body>

<header>
<div class="header">
<div class="logo">School<span>Portal</span></div>
<button class="menu" onclick="alert('School Portal • Prototype')">☰</button>
</div>
</header>

<div class="container">

<div class="hero">
<h1>Welcome back, Alex 👋</h1>
<p>Student Dashboard • Class 12 • Roll No. 24</p>
</div>

<div class="tabs">
<button class="tab active" onclick="showPage('student',this)">
🎓 Student
</button>

<button class="tab" onclick="openLogin('teacher')">
👨‍🏫 Teacher 🔒
</button>

<button class="tab" onclick="openLogin('admin')">
🛠️ Admin 🔒
</button>
</div>

</div>

</div>

<h3>Fees Due</h3>

</div>

</div>
